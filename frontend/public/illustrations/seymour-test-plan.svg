<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" role="img">
<title>Synthetic engine test-plan diagram</title>
<desc>Original illustration: rectangular requirement regions on a speed and torque grid, with four numbered planned points joined in order. A planning diagram, not an engine map; it shows no performance curve or operating envelope.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14161a"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
</defs>
<rect width="780" height="262" fill="url(#bg)"/>
<g stroke="#8f99a8" stroke-width="0.5" opacity="0.22">
<line x1="150" y1="30" x2="150" y2="214"/><line x1="240" y1="30" x2="240" y2="214"/><line x1="330" y1="30" x2="330" y2="214"/><line x1="420" y1="30" x2="420" y2="214"/><line x1="510" y1="30" x2="510" y2="214"/><line x1="600" y1="30" x2="600" y2="214"/><line x1="690" y1="30" x2="690" y2="214"/>
<line x1="60" y1="76" x2="720" y2="76"/><line x1="60" y1="122" x2="720" y2="122"/><line x1="60" y1="168" x2="720" y2="168"/>
</g>
<line x1="60" y1="214" x2="720" y2="214" stroke="#9aa1ac" stroke-width="1.2"/>
<line x1="60" y1="30" x2="60" y2="214" stroke="#9aa1ac" stroke-width="1.2"/>
<text x="390" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#9aa1ac">SPEED (rpm)</text>
<text x="22" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#9aa1ac" transform="rotate(-90 22 122)">TORQUE (N·m)</text>
<g fill="none" stroke-width="1.6">
<rect x="110" y="136" width="120" height="56" stroke="#d0312d"/>
<rect x="300" y="52" width="130" height="64" stroke="#d0312d" stroke-dasharray="7 4"/>
<rect x="480" y="100" width="120" height="72" stroke="#d0312d" stroke-dasharray="2 4"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9aa1ac">
<text x="114" y="148">R1</text><text x="304" y="64">R2</text><text x="484" y="112">R3</text>
</g>
<polyline points="160,164 360,84 540,136 280,64" fill="none" stroke="#e8eaed" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
<circle cx="160" cy="164" r="9" fill="#e8eaed"/><text x="160" y="167.5" fill="#0b0c0e">1</text>
<circle cx="360" cy="84" r="9" fill="#e8eaed"/><text x="360" y="87.5" fill="#0b0c0e">2</text>
<circle cx="540" cy="136" r="9" fill="#e8eaed"/><text x="540" y="139.5" fill="#0b0c0e">3</text>
<circle cx="280" cy="64" r="9" fill="#e8eaed"/><text x="280" y="67.5" fill="#0b0c0e">4</text>
</g>
<text x="390" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#6b727d">SYNTHETIC PLANNING DIAGRAM · NOT AN ENGINE MAP · INVENTED FOR GRIDPROOF</text>
</svg>
