
name: GridProof CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://gridproof:dummy@localhost:5432/gridproof
      # Disposable service container below; never a production database.
      TEST_DATABASE_URL: postgresql://gridproof:gridproof_test@localhost:5432/gridproof_test
      # Fail (instead of skip) integration tests if the database is missing.
      GRIDPROOF_REQUIRE_TEST_DB: "1"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gridproof
          POSTGRES_PASSWORD: gridproof_test
          POSTGRES_DB: gridproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridproof -d gridproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m ruff format --check app tests migrations/env.py

      - name: Lint
        run: python -m ruff check app tests migrations/env.py

      - name: Run tests
        run: python -m pytest -q
